<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa Rica Chat</title>
<style>
  :root {
    --bg: #f6f3ec; --card: #ffffff; --ink: #1f2a24; --muted: #5d6b63;
    --brand: #1f6f50; --brand-ink: #ffffff; --accent: #c8102e;
    --bubble-me: #1f6f50; --bubble-me-ink: #ffffff; --bubble-them: #ffffff;
    --line: #e2ddd1; --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17; --card: #1d2521; --ink: #edf2ee; --muted: #a3b1a8;
      --brand: #3fa57c; --brand-ink: #0d1411; --accent: #ff5a6e;
      --bubble-me: #2f8a64; --bubble-me-ink: #ffffff; --bubble-them: #26302b;
      --line: #2e3833;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  header h1 { margin: 0 0 4px; font-size: 1.8rem; }
  header p { margin: 0 0 20px; color: var(--muted); }
  .flag { display: inline-block; width: 28px; height: 18px; vertical-align: -2px; margin-right: 6px; border-radius: 3px;
    background: linear-gradient(#002b7f 0 16.6%, #fff 16.6% 33.3%, #ce1126 33.3% 66.6%, #fff 66.6% 83.3%, #002b7f 83.3%); }
  .level { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .level label { font-weight: 600; }
  select, button, textarea { font: inherit; }
  select { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .scenario {
    text-align: left; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .scenario:hover, .scenario:focus-visible { border-color: var(--brand); outline: none; }
  .scenario .emoji { font-size: 2rem; display: block; }
  .scenario strong { display: block; margin-top: 6px; }
  .scenario span.task { color: var(--muted); font-size: .9rem; }
  #chat { display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar h2 { margin: 0; font-size: 1.2rem; }
  .btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn:disabled { opacity: .5; cursor: default; }
  .goal { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted); font-size: .95rem; margin-bottom: 12px; }
  #log { display: flex; flex-direction: column; gap: 10px; min-height: 280px; max-height: 55vh; overflow-y: auto; padding: 4px 2px 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.them { align-self: flex-start; background: var(--bubble-them); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); color: var(--bubble-me-ink); border-bottom-right-radius: 4px; }
  .msg.feedback { align-self: stretch; max-width: 100%; background: var(--card); border: 2px solid var(--brand); }
  .msg.error { align-self: center; color: var(--accent); background: transparent; font-size: .9rem; }
  .who { font-size: .75rem; font-weight: 600; opacity: .7; display: block; margin-bottom: 2px; }
  form { display: flex; gap: 8px; margin-top: 8px; }
  textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-height: 46px; }
  .typing { color: var(--muted); font-style: italic; }
  footer { margin-top: 28px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="flag" aria-hidden="true"></span>Costa Rica Chat</h1>
    <p>Practicá español tico en situaciones de la vida real. ¡Pura vida!</p>
  </header>

  <section id="picker">
    <div class="level">
      <label for="level">Tu nivel:</label>
      <select id="level">
        <option value="A1">A1 – Principiante</option>
        <option value="A2" selected>A2 – Básico</option>
        <option value="B1">B1 – Intermedio</option>
        <option value="B2">B2 – Avanzado</option>
      </select>
    </div>
    <div class="grid" id="scenarios"></div>
  </section>

  <section id="chat" aria-live="polite">
    <div class="bar">
      <h2 id="chat-title"></h2>
      <div>
        <button class="btn" id="finish" type="button">Terminar y ver comentarios</button>
        <button class="btn" id="back" type="button">← Escenas</button>
      </div>
    </div>
    <div class="goal" id="goal"></div>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" rows="1" maxlength="800" placeholder="Escribí en español…" aria-label="Tu mensaje"></textarea>
      <button class="btn primary" id="send" type="submit">Enviar</button>
    </form>
  </section>

  <footer>Los personajes son inteligencia artificial y pueden cometer errores. No compartás información personal.</footer>
</div>

<script>
const SCENARIOS = {
  soda:     { emoji: "🍛", title: "En la soda", who: "Doña Marta",
              task: "Pedí comida y un fresco, y pagá la cuenta.",
              opening: "¡Buenas! Pase adelante, siéntese donde guste. ¿Qué le sirvo hoy?" },
};

const $ = (id) => document.getElementById(id);
let current = null;   // scenario key
let history = [];     // [{role, content}] sent to the server (starts with the student)
let busy = false;

// Build scenario cards
for (const [key, s] of Object.entries(SCENARIOS)) {
  const b = document.createElement("button");
  b.className = "scenario";
  b.type = "button";
  b.innerHTML = `<span class="emoji">${s.emoji}</span><strong>${s.title}</strong><span class="task">${s.task}</span>`;
  b.addEventListener("click", () => start(key));
  $("scenarios").appendChild(b);
}

function addMsg(kind, text, who) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  if (who) {
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = who;
    div.appendChild(w);
  }
  div.appendChild(document.createTextNode(text));
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

function start(key) {
  current = key;
  history = [];
  const s = SCENARIOS[key];
  $("chat-title").textContent = `${s.emoji} ${s.title}`;
  $("goal").textContent = "🎯 Tu meta: " + s.task;
  $("log").innerHTML = "";
  addMsg("them", s.opening, s.who);
  $("picker").style.display = "none";
  $("chat").style.display = "block";
  setBusy(false);
  $("input").focus();
}

function setBusy(v) {
  busy = v;
  $("send").disabled = v;
  $("finish").disabled = v || history.length === 0;
}

async function send(text, { isFinish = false } = {}) {
  if (busy || !text.trim()) return;
  const s = SCENARIOS[current];
  if (!isFinish) addMsg("me", text, "Vos");
  history.push({ role: "user", content: text });
  setBusy(true);
  const typing = addMsg("them typing", isFinish ? "Preparando tus comentarios…" : `${s.who} está escribiendo…`);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scenario: current, level: $("level").value, messages: history }),
    });
    const data = await res.json().catch(() => ({}));
    typing.remove();
    if (!res.ok || !data.reply) {
      history.pop(); // let the student try again
      addMsg("error", data.error || "Algo salió mal. Intentá de nuevo.");
    } else {
      history.push({ role: "assistant", content: data.reply });
      addMsg(isFinish ? "feedback" : "them", data.reply, isFinish ? "📝 Comentarios" : s.who);
    }
  } catch {
    typing.remove();
    history.pop();
    addMsg("error", "No hay conexión. Intentá de nuevo.");
  }
  setBusy(false);
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value;
  $("input").value = "";
  send(text);
});

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

$("finish").addEventListener("click", () => send("[TERMINAR]", { isFinish: true }));

$("back").addEventListener("click", () => {
  $("chat").style.display = "none";
  $("picker").style.display = "block";
});
</script>
</body>
</html>
